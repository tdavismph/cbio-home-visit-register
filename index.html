html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-column field tool. Sticky role bar, task list first, large touch targets for a 7-10 inch tablet. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --sunk:#e3ebe8; --ink:#14302b; --muted:#566b66; --line:#cdd9d5;
  --accent:#1c6aa8; --accent-ink:#ffffff; --good:#23794d; --warn:#9a6200; --bad:#b3261e;
  --good-bg:#dff1e6; --warn-bg:#fbeccb; --bad-bg:#f9dedb; --info-bg:#dcebf7;
  --font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1917; --surface:#182522; --sunk:#22312d; --ink:#e6efec; --muted:#9db0ab; --line:#33453f;
  --accent:#6db4ea; --accent-ink:#06243a; --good:#6fd09a; --warn:#f0bd5c; --bad:#ff8f86;
  --good-bg:#173625; --warn-bg:#3d2f10; --bad-bg:#45201d; --info-bg:#15303f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1917; --surface:#182522; --sunk:#22312d; --ink:#e6efec; --muted:#9db0ab; --line:#33453f;
  --accent:#6db4ea; --accent-ink:#06243a; --good:#6fd09a; --warn:#f0bd5c; --bad:#ff8f86;
  --good-bg:#173625; --warn-bg:#3d2f10; --bad-bg:#45201d; --info-bg:#15303f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px}
.brand{font-weight:800;font-size:17px;margin-right:auto;min-width:0}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:6px}
nav button{flex:none}
main{padding-block:16px 64px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:800;text-wrap:balance}
h3{font-size:13px;margin:0;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.tab{border-color:transparent;background:transparent;color:var(--muted)}
button.tab.on{background:var(--sunk);color:var(--ink)}
button.link{border:0;background:none;color:var(--accent);padding:4px 0;min-height:0;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select,input,textarea{min-height:44px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);max-width:100%}
textarea{width:100%;min-height:96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 200px;min-width:0}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700;background:var(--sunk)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.info{background:var(--info-bg);color:var(--accent)}
.task{border-left:6px solid var(--line)} .task.p1{border-left-color:var(--bad)} .task.p2{border-left-color:var(--warn)} .task.p3{border-left-color:var(--good)}
.q{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q label.t{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-width:88px} .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg.multi button{text-align:left;font-weight:600}
.seg.multi button.on{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.seg.multi.neutral button.on{background:var(--info-bg);color:var(--accent);border-color:var(--accent)}
.seg.multi button.none.on,.seg.multi.neutral button.none.on{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.q.miss label.t{color:var(--bad)} .q.miss label.t::after{content:" *"}
.big{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:right;white-space:nowrap}
td input{min-height:34px;padding:4px 6px;width:84px}
.meter{height:10px;background:var(--sunk);border-radius:5px;position:relative;min-width:110px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.note{background:var(--info-bg);border-radius:var(--r);padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--good)} .dot.off{background:var(--warn)}
.tap{min-height:120px;font-size:22px;width:100%}
</style></head>

function vix(){if(!VIX){VIX={s:{},h:{}};for(const v of S.v){(VIX.s[v.subj]=VIX.s[v.subj]||[]).push(v);(VIX.h[v.hhId]=VIX.h[v.hhId]||[]).push(v);}
  const o=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;for(const k in VIX.s)VIX.s[k].sort(o);for(const k in VIX.h)VIX.h[k].sort(o);}return VIX;}

function hhLast(hhId,q){const vs=vix().h[hhId]||[];for(let i=vs.length-1;i>=0;i--)if(vs[i].a[q]!==undefined)return vs[i].a[q];}
const ageD=c=>diff(c.death||TODAY,c.dob);
const active=p=>!p.death&&!p.out;
function sched(kind,p){ // -> [{slot,due,win,done}]
  return S.cfg.slots.filter(s=>(kind==="w"?s[1]!=="dob":s[1]==="dob")&&(s[1]==="reg"?p.reg:s[1]==="edd"?p.edd:p.dob)).map(s=>{
    const anchor=s[1]==="reg"?p.reg:s[1]==="edd"?p.edd:p.dob;const due=addD(anchor,s[2]);
    const done=visitsOf(p.id).find(v=>v.slot===s[0]&&v.role==="chw");return {slot:s[0],due,win:s[3],done};});
}
const TRACK=()=>S.sess.role==="chv"?"fort":"ten"; // Care Group Volunteers visit every 2 weeks; the CHW makes the 10 scheduled visits
function stageAt(kind,p,date){if(kind==="w")return 280-diff(p.edd,date)>=224?"P2":"P1";const a=diff(date,p.dob);
  return a<3?"N1":a<6?"N3":a<28?"N7":a<70?"W6":a<183?"W14":a<274?"M6":a<548?"M9":"M18";}
function nextSlot(kind,p,track){
  if(kind==="w"&&!p.preg)return null;
  if((track||TRACK())==="fort"){
    if(kind==="c"&&ageD(p)>=730)return null;
    const vs=visitsOf(p.id).filter(v=>v.role==="chv");
    return {slot:stageAt(kind,p,TODAY),due:vs.length?addD(vs[vs.length-1].date,14):p.reg,win:14,fn:1};
  }
  if(kind==="c"&&diff(p.reg,p.dob)>2&&ageD(p)<730&&!visitsOf(p.id).some(v=>v.role==="chw"))return {slot:stageAt(kind,p,TODAY),due:p.reg,win:60,first:1}; // enrolled by census: first CHW visit
  for(const s of sched(kind,p)){if(s.done)continue;if(kind==="c"&&dn(s.due)<dn(p.reg)-s.win)continue;
    if(diff(TODAY,s.due)>s.win)continue;return s;}
  return null;
}
const cardSeen=c=>Object.keys(c.vax||{}).length>0||visitsOf(c.id).some(v=>v.a.c_vax!==undefined);
function risk(kind,p){ // start-up priority: higher score is visited first. Weights follow relative risk of death; they are judgments, not a fitted model.
  const h=by("hh",p.hhId)||{},R=[];let s=0;const add=(n,l)=>{s+=n;R.push(l);};
  if(kind==="c"){const a=ageD(p);if(a<7)add(60,"First week of life");else if(a<28)add(50,"Under 1 month");else s+=a<183?25:a<365?12:5;
    if(p.small&&a<183)add(25,"Small baby");if(p.cSick&&!visitsOf(p.id).some(v=>v.role==="chw"))s+=70;if(p.cNoVax)add(15,"No vaccine yet");}
  else{const ga=280-diff(p.edd,TODAY);if(ga>=252)add(40,"Due within 4 weeks");else s+=ga>=196?20:8;
    if(p.cFirst)add(10,"First pregnancy");if(p.age&&(p.age<18||p.age>=35))add(10,"Age under 18 or 35 and over");if(p.cNoAnc)add(15,"No antenatal care yet");}
  if(S.r.some(r=>r.subj===p.id&&r.st==="open"))s+=80;const lv=visitsOf(p.id).slice(-1)[0];if(lv&&lv.support&&!lv.supportDone)s+=80;
  if(h.prevDeath)add(15,"Earlier child death in household");if(h.far)add(10,"Far from health facility");
  return {s,R};}
function tasks(kind,p,role){ // -> [{pri,txt,cls,act}]
  const T=[];if(!active(p))return T;
  const refs=S.r.filter(r=>r.subj===p.id);
  for(const r of refs){
    if(r.st==="open")T.push({pri:1,txt:t("Referral not yet completed")+": "+r.reason,cls:"bad"});
    if(r.st==="done"&&r.fu&&!r.fuDone&&diff(TODAY,r.fu)>=-1)T.push({pri:1,txt:t("Follow-up after referral"),cls:"bad",fu:r.id});
  }
  const lv=visitsOf(p.id).slice(-1)[0];
  if(lv&&lv.support&&!lv.supportDone)T.push({pri:1,txt:t("CHW support requested"),cls:"bad",sup:lv.id});
  const ns=nextSlot(kind,p);
  if(p.cSick&&!visitsOf(p.id).some(v=>v.role==="chw"))T.push({pri:1,txt:t("Sick on census day"),cls:"bad"});
  if(ns){const late=diff(TODAY,ns.due),lim=ns.first?14:3;
    if(late>=-(ns.fn?3:14)){const nb=kind==="c"&&ageD(p)<28&&!ns.fn; // visits in the first month are time-critical
      T.push({pri:nb?1:late>lim?2:3,txt:(late>lim?t("Overdue"):t("Due"))+": "+t(ns.first?"First CHW visit":ns.fn?"Home visit":SLOTNAME[ns.slot]),cls:nb?"bad":late>lim?"warn":"good",slot:ns.slot});}}
  if(kind==="w"&&p.preg){
    const ga=280-diff(p.edd,TODAY),exp=[84,140,182,210,238,252,266,280].filter(x=>x<=ga).length,anc=last(p.id,"p_anc")??p.anc??0;
    if(anc<exp-1)T.push({pri:2,txt:t("Antenatal care behind schedule")+" ("+anc+"/"+exp+")",cls:"warn"});
    if(ga>=196&&(last(p.id,"p_td")??0)<2)T.push({pri:2,txt:t("Tetanus protection incomplete"),cls:"warn"});
    if(diff(p.edd,TODAY)<=14&&!((last(p.id,"p_plan")||[]).length>=2))T.push({pri:2,txt:t("No birth plan"),cls:"warn"});
    if(diff(TODAY,p.edd)>7)T.push({pri:1,txt:t("Past due date, birth not recorded"),cls:"bad"});
    const sy=last(p.id,"p_sys"),di=last(p.id,"p_dia");if(sy>=140||di>=90)T.push({pri:1,txt:t("High blood pressure")+" "+sy+"/"+di,cls:"bad"});
  }
  if(kind==="c"){const a=ageD(p);
    const od=S.cfg.vax.filter(x=>a>x[1]+14&&!(p.vax||{})[x[0]]).map(x=>x[0]);
    const seen=cardSeen(p);
    if(a>70&&((seen&&!(p.vax||{}).PENTA1)||(!seen&&p.cNoVax)))T.push({pri:1,txt:t("Zero-dose child"),cls:"bad"});
    else if(seen&&od.length)T.push({pri:2,txt:t("Vaccine overdue")+": "+od.slice(0,4).join(", ")+(od.length>4?" +"+(od.length-4):""),cls:"warn"});
    if(p.small&&a<28)T.push({pri:2,txt:t("Small baby: extra visits"),cls:"warn"});
    const m=last(p.id,"c_muac");if(m!==undefined&&a>=180){if(m<11.5)T.push({pri:1,txt:t("Severe acute malnutrition")+" (MUAC "+m+")",cls:"bad"});else if(m<12.5)T.push({pri:2,txt:t("Low MUAC")+" ("+m+")",cls:"warn"});}
  }
  return T.sort((a,b)=>a.pri-b.pri);
}

  if(s.role==="chw"){const ids=S.staff.filter(x=>x.chwId===s.id).map(x=>x.id).concat(s.id);return S.hh.filter(h=>ids.includes(h.chvId));}return S.hh;}

function coverage(P){ // measured coverage for each modelled intervention: {id:[num,den]}
  const {W,C,H}=P,o={},births=C.filter(c=>c.place);
  const share=(arr,f)=>[arr.filter(f).length,arr.length];
  o.sba=share(births,c=>c.sba);o.fac=share(births,c=>c.place==="f");o.warm=share(births,c=>c.warm);o.chx=share(births,c=>c.chx);
  const sm=births.filter(c=>c.small);o.kmc=share(sm.filter(c=>last(c.id,"n_kmc")!==undefined),c=>last(c.id,"n_kmc")===1);
  o.td=share(births.filter(c=>c.mTd!==undefined),c=>c.mTd>=2);
  const cid=new Set(C.map(c=>c.id)),V=S.v.filter(v=>cid.has(v.subj));
  const ans=(q,f)=>{const a=V.filter(v=>v.a[q]!==undefined&&(!f||f(v)));return [a.filter(v=>v.a[q]===1).length,a.length];};
  o.ebf_d=o.ebf_p=ans("n_ebf");o.ors=ans("c_ors");o.zinc=ans("c_zinc");o.pneu=ans("c_pneu");

function danger(F,p){const a=F.a,o=[];
  for(const [q,L] of [["p_danger",PD],["n_danger",ND],["m_danger",MD],["c_danger",CD]])for(const i of a[q]||[])o.push(L[i]);
  if(a.n_temp>=37.5)o.push("Feels hot (fever)");if(a.n_temp&&a.n_temp<35.5)o.push("Feels cold");
  if(a.n_rr){const d=p.dob?ageD(p):0,lim=d<60?60:d<365?50:40;if(a.n_rr>=lim)o.push("Fast or difficult breathing");}
  if(a.c_muac&&a.c_muac<11.5&&p.dob&&ageD(p)>=180)o.push("Severe acute malnutrition");
  if(a.p_sys>=140||a.p_dia>=90)o.push("High blood pressure");
  return [...new Set(o)];
}

    '<div class="row"><input id="newlang" class="grow" placeholder="'+esc(t("Type a language name"))+'" list="lgs"><datalist id="lgs">'+["French","Portuguese","Spanish","Haitian Creole","Luo","Kikuyu","Somali","Amharic","Hausa","Twi","Ewe","Arabic","Hindi","Bengali","K'iche'","Quechua"].map(x=>"<option>"+x+"</option>").join("")+'</datalist><button class="pri" data-act="getlang">'+esc(t("Download"))+'</button></div><p class="small muted" id="langmsg">A new language needs a connection once. It is then stored on this tablet and works offline.</p></div>';
  h+='<div class="card"><h3>Visit schedule ('+S.cfg.country+')</h3><div class="tblwrap"><table><tr><th>Visit</th><th>Timing</th></tr>'+S.cfg.slots.map(s=>"<tr><td>"+esc(t(SLOTNAME[s[0]]))+"</td><td>"+(s[1]==="reg"?"At registration":s[1]==="edd"?"6 weeks before due date":"Day "+s[2]+" after birth")+"</td></tr>").join("")+'</table></div><p class="small muted">The CHW makes these 10 visits to every household and takes the measurements. Each Care Group Volunteer also visits her 12 households every 2 weeks, with the questions for the woman\'s or child\'s current stage, and asks the CHW for support when she finds a problem.</p></div>';
  h+='<div class="card"><h3>Immunization schedule ('+S.cfg.country+')</h3><div class="row">'+S.cfg.vax.map(x=>'<span class="chip">'+x[0]+" · "+(x[1]<200?Math.round(x[1]/7)+" wk":Math.round(x[1]/30.44)+" mo")+"</span>").join("")+"</div></div>";
  h+='<div class="card"><h3>Data</h3><p class="small muted">Pilot build 0.1. Records are stored on this tablet only. The shared server, worker logins and syncing between tablets are the next stage. Example data is rebuilt each time the app opens and is never stored.</p><div class="row"><button data-act="export">Export records from this tablet (file)</button><button data-act="loaddemo">Load example data</button><button data-act="cleardemo">'+esc(t("Remove example data"))+"</button></div></div>";
  return h;}

/* ---------- actions ---------- */
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
let rrT=null;
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset,F=UI.f;
  if(d.go)return go(d.go);
  if(d.ans!==undefined){F.a=F.a||{};F.a[d.ans]=+d.v===F.a[d.ans]&&d.ans==="support"?0:+d.v;return keep();}
  if(d.none){F.a=F.a||{};const c=F.a[d.none];if(Array.isArray(c)&&!c.length)delete F.a[d.none];else F.a[d.none]=[];return keep();} // an empty list means "none of the above" was chosen
  if(d.multi){F.a=F.a||{};const a=F.a[d.multi]=F.a[d.multi]||[],i=a.indexOf(+d.v);i<0?a.push(+d.v):a.splice(i,1);if(!a.length)delete F.a[d.multi];return keep();}
  if(d.vax){const a=F.a.c_vax=F.a.c_vax||[],i=a.indexOf(d.vax);i<0?a.push(d.vax):a.splice(i,1);if(!a.length)delete F.a.c_vax;return keep();}
  const A=d.act;if(!A)return;
  if(A==="sync")return sync();
  if(A==="person")return go("person",{kind:d.kind,id:d.id});
  if(A==="visit")return go("visit",{kind:d.kind,id:d.id,slot:d.slot,a:{}});
  if(A==="savevisit")return saveVisit();
  if(A==="addp")return go("addp",{kind:d.kind,hh:d.hh,a:{}});
  if(A==="savehh"){if(!val("f_head"))return;put("hh",{id:uid("h"),chvId:S.sess.id,village:val("f_vil"),head:val("f_head")});return go("reg");}
  if(A==="savep"){const n=val("f_name");if(!n)return;
    if(F.kind==="w"){const edd=val("f_edd");if(!edd)return;put("w",{id:uid("w"),hhId:F.hh,name:n,age:+val("f_age")||null,preg:true,edd,reg:TODAY,anc:+val("f_anc")||0});}
    else{const dob=val("f_dob");if(!dob||dob>TODAY||diff(TODAY,dob)>730)return;const m=put("w",{id:uid("w"),hhId:F.hh,name:val("f_mother")||"?",preg:false,reg:TODAY,del:dob});
      put("c",{id:uid("c"),hhId:F.hh,mId:m.id,name:n,sex:F.a.sex===1?"m":"f",dob,reg:TODAY,vax:{}});}
    return go("reg");}
  if(A==="birth")return go("birth",{id:d.id,a:{}});
  if(A==="savebirth"){const w=by("w",F.id),a=F.a,date=val("f_date")||TODAY;w.preg=false;w.del=date;
    if(a.out===1){w.sb=1;put("w",w);return go("reg");}put("w",w);
    const c=put("c",{id:uid("c"),hhId:w.hhId,mId:w.id,name:val("f_name")||"Baby of "+w.name,sex:a.sex===1?"m":"f",dob:date,reg:date,place:["f","h","r"][a.place??0],sba:a.sba===1?1:0,eibf:a.eibf===1?1:0,chx:a.chx===1?1:0,warm:a.warm===1?1:0,
      small:a.small===1||(+val("f_bw")>0&&+val("f_bw")<2500)?1:0,bw:+val("f_bw")||null,mTd:last(w.id,"p_td")??0,mAnc:last(w.id,"p_anc")??w.anc??0,vax:{}});
    return go("person",{kind:"c",id:c.id});}
  if(A==="refer"){const p=subj(d.kind,d.id);put("r",{id:uid("r"),subj:p.id,kind:d.kind,hhId:p.hhId,date:TODAY,reason:"Refer to health facility",by:S.sess.id,st:"open"});return go("refs");}
  if(A==="arr"||A==="refuse"){const r=by("r",d.id);r.st=A==="arr"?"arrived":"refused";r.arr=TODAY;put("r",r);return render();}
  if(A==="counter")return go("counter",{id:d.id});
  if(A==="savecounter"){const r=by("r",F.id);r.st="done";r.dx=val("f_dx");r.tx=val("f_tx");r.fu=val("f_fu");put("r",r);return go("refs");}
  if(A==="death")return go("death",{kind:d.kind,id:d.id,a:{}});
  if(A==="va"){const x=by("d",d.id);return go("death",{kind:x.kind,id:x.subj,did:x.id,a:{}});}
  if(A==="savedeath"){const a=F.a,p=subj(F.kind,F.id),PL=["Home","Relative's house","Hospital","Clinic","Other"];
    const rec=F.did?by("d",F.did):{id:uid("d"),subj:p.id,kind:F.kind,date:val("f_date")||TODAY};rec.place=PL[a.place??0];
    if(document.getElementById("f_cause"))rec.va={who:val("f_who"),rel:val("f_rel"),narr:val("f_narr"),delays:[0,1,2,3].map(i=>a["dl"+i]===1?1:0),why:a.why||[],home:a.home===1?1:0,notes:val("f_dnote"),cause:val("f_cause"),by:S.sess.id,date:TODAY};
    put("d",rec);p.death=rec.date;put(F.kind==="w"?"w":"c",p);return go(S.sess.role==="chw"?"due":"reg");}
  if(A==="addchw"){if(!val("f_wname"))return;put("staff",{id:uid("s"),role:"chw",name:val("f_wname"),village:val("f_wvil"),cg:1+Math.max(0,...S.staff.map(x=>x.cg||0))});return go("staff");}
  if(A==="addcgv"){if(!val("f_vname"))return;const w=by("staff",val("f_vchw"));put("staff",{id:uid("s"),role:"chv",name:val("f_vname"),village:val("f_vvil"),chwId:w.id,cg:w.cg});return go("staff");}
  if(A==="export"){const o={exported:new Date().toISOString(),cfg:S.cfg};for(const ty of TYPES)o[ty]=S[ty].filter(r=>!r.demo);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download="cbio-register-"+TODAY+".json";document.body.appendChild(a);a.click();a.remove();return;}
  if(A==="census")return go("census",{a:{},m:[],d:[]});
  if(A==="addmem"){F.m.push(d.kind);return keep();}
  if(A==="adddeath"){F.d.push(1);return keep();}
  if(A==="savecensus")return saveCensus();
  if(A==="usecensus"){const c=censusStats();if(c.lb>=500){S.cfg.rates.nmr=Math.round(c.d0/c.lb*10000)/10;S.cfg.rates.pn=Math.round(c.dpn/c.lb*10000)/10;save();}return render();}
  if(A==="rr"){let n=0,left=60;const box=$("#rrbox");clearInterval(rrT);
    box.innerHTML='<button class="tap pri" id="tapb">'+esc(t("Tap once for each breath"))+' · <span id="rn">0</span></button><p class="small muted"><span id="rl">60</span> '+esc(t("seconds left"))+"</p>";
    $("#tapb").onclick=ev=>{ev.stopPropagation();n++;$("#rn").textContent=n;};
    rrT=setInterval(()=>{left--;const l=$("#rl");if(!l){clearInterval(rrT);return;}l.textContent=left;if(left<=0){clearInterval(rrT);F.a.n_rr=n;keep();}},1000);return;}
  if(A==="cleardemo"){S.demoOn=false;VIX=null;for(const ty of TYPES)S[ty]=S[ty].filter(r=>!r.demo&&!r.ex);if(!by("staff",S.sess.id))S.sess={role:"admin",id:null};save();return go("reg");}
  if(A==="loaddemo"){if(S.demoOn===false){S.demoOn=true;demo();save();}return go("due");}
  if(A==="resetcfg"){S.cfg=JSON.parse(JSON.stringify(DEFAULT_CFG));save();return render();}
  if(A==="copycsv"){const I=indicators(people(S.hh)),csv="group,indicator,numerator,denominator,percent\n"+I.map(i=>[i.g,i.label,i.n,i.d,pct(i.n,i.d)??""].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
    const ok=()=>$("#copymsg").textContent="Copied";try{navigator.clipboard.writeText(csv).then(ok,()=>$("#copymsg").textContent="Copy is blocked here");}catch(err){$("#copymsg").textContent="Copy is blocked here";}return;}
  if(A==="getlang")return getLang(val("newlang"));
});
function keep(){const y=window.scrollY;stash();render();window.scrollTo(0,y);}
function stash(){document.querySelectorAll("#app input[id^=f_],#app textarea[id^=f_],#app select[id^=f_]").forEach(e=>{UI.f.keep=UI.f.keep||{};UI.f.keep[e.id]=e.value;});}
const obs=new MutationObserver(()=>{const k=UI.f&&UI.f.keep;if(!k)return;for(const id in k){const e=document.getElementById(id);if(e&&e.value!==k[id]&&document.activeElement!==e)e.value=k[id];}});
document.addEventListener("input",e=>{const d=e.target.dataset;
  if(d.num){const v=e.target.value;if(v==="")delete UI.f.a[d.num];else UI.f.a[d.num]=+v;}
  if(e.target.id==="regq"){UI.f={q:e.target.value};const y=window.scrollY;render();const i=$("#regq");i.focus();i.setSelectionRange(i.value.length,i.value.length);window.scrollTo(0,y);}});
document.addEventListener("change",e=>{const el=e.target,d=el.dataset;
  if(el.id==="lang"){lang=S.lang=el.value;save();render();}
  if(el.id==="role"){const [r,id]=el.value.split("|");S.sess={role:r,id:id||null};save();go(r==="admin"?"admin":"due");}
  if(d.num&&UI.view==="visit")keep();
  if(d.cfg){const path=d.cfg.split("."),v=+el.value;if(isNaN(v))return;let o=S.cfg;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=v;save();const y=window.scrollY;render();window.scrollTo(0,y);}});
addEventListener("online",()=>{renderBar();sync();});addEventListener("offline",renderBar);

/* ---------- language download (needs a connection once, then cached) ---------- */
async function getLang(name){
  const msg=$("#langmsg");if(!name)return;
  if(!navigator.onLine){msg.textContent="No connection. Connect once to download a language.";return;}
  let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;}catch(e){}
  if(!sample){msg.textContent="More languages become available once the server is connected (next stage).";return;}
  const keys=Object.keys(SW),out={},CH=70;msg.textContent="Downloading "+name+"…";
  try{for(let i=0;i<keys.length;i+=CH){const part=keys.slice(i,i+CH);
      const r=await sample.json("Translate each string in this JSON array from English into "+name+" for community health workers using a tablet app about maternal and child health home visits in East Africa. Use plain, common words. Keep abbreviations such as ORS, MUAC, CHW, HIV, DALY unchanged. Reply with only a JSON array of the translated strings, same length and order.\n\n"+JSON.stringify(part),{modelTier:"default"});
      if(!Array.isArray(r)||r.length!==part.length)throw {code:"invalid_json"};part.forEach((k,j)=>out[k]=String(r[j]));
      msg.textContent="Downloading "+name+"… "+Math.min(100,Math.round(100*(i+CH)/keys.length))+"%";}
    const code="x_"+name.toLowerCase().replace(/[^a-z]/g,"").slice(0,12);LANGS[code]={name,d:out};
    const L={};for(const k in LANGS)if(k!=="en"&&k!=="sw")L[k]=LANGS[k];IDB.set("langs",L);
    lang=S.lang=code;save();render();
  }catch(e){msg.textContent=e&&e.code==="not_granted"?"Permission to translate was not given.":"The download did not finish. Try again when the connection is stable.";}
}

/* ---------- start ---------- */
(async()=>{
  await load();
  if(S.sess.role!=="admin"&&!by("staff",S.sess.id))S.sess={role:"admin",id:null};
  UI.view=S.sess.role==="admin"?"admin":"due";
  obs.observe(document.getElementById("app"),{childList:true});
  render();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
